<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Owner verification · BOOKRR</title><link rel="stylesheet" href="/theme.css"><style>.page{max-width:1100px;margin:50px auto;padding:0 22px}.page h1{font:800 clamp(42px,7vw,76px)/.9 var(--display)}.item{background:#191e17;border:1px solid #ffffff20;padding:20px;margin:14px 0;display:grid;grid-template-columns:1fr auto;gap:18px}.meta{font-size:13px;color:#aab49e;line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:11px;background:var(--lime);border:0;font-weight:800;cursor:pointer}.actions .reject{background:transparent;color:#f3f4eb;border:1px solid #ffffff40}.message{color:var(--lime);font-size:13px}@media(max-width:650px){.item{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a class="brand" href="/"><img class="brand-logo" src="/icon.svg" alt="" width="38" height="38">BOOKRR</a><div class="nav-links" style="display:flex"><a href="/admin.html">Admin dashboard</a></div></nav><main class="page"><div class="eyebrow">RESTRICTED · PROJECT ADMIN ONLY</div><h1>OWNER <span class="lime-word">VERIFICATION.</span></h1><p class="meta">Approving a pending application creates a verified, active venue listing and assigns it to the applicant's account. Duplicate venue names are blocked for manual review.</p><p id="message" class="message" role="status" aria-live="polite">Loading applications…</p><div id="list"></div></main><script>
(async()=>{const m=document.getElementById('message'),list=document.getElementById('list');async function load(){const r=await fetch('/api/admin/owner-applications',{headers:{Accept:'application/json'}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(r.status===401?'Sign in as the project owner/admin.':r.status===403?'Access denied. Admin only.':(d.error||'Could not load applications.'));list.replaceChildren();m.textContent=(d.applications||[]).filter(a=>a.status==='pending').length+' pending application(s)';for(const a of d.applications||[]){const card=document.createElement('article');card.className='item';const info=document.createElement('div'),title=document.createElement('h3'),meta=document.createElement('p');title.textContent='#'+a.id+' · '+a.venue_name;meta.className='meta';meta.textContent=a.applicant_name+' · '+a.contact_phone+' · '+a.area+' · '+(a.sports||[]).join(', ')+' · ₹'+(a.hourly_rate??'not set')+'/hour · '+a.opening_time.slice(0,5)+'–'+a.closing_time.slice(0,5)+' · '+a.status;info.append(title,meta);const actions=document.createElement('div');actions.className='actions';if(a.status==='pending'){for(const [status,label] of [['approved','Approve & list'],['rejected','Reject']]){const b=document.createElement('button');b.textContent=label;if(status==='rejected')b.className='reject';b.onclick=async()=>{b.disabled=true;try{const u=await fetch('/api/admin/owner-applications',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:a.id,status})}),out=await u.json().catch(()=>({}));if(!u.ok)throw Error(out.error||'Update failed');await load()}catch(e){m.textContent=e.message}finally{b.disabled=false}};actions.append(b)}}card.append(info,actions);list.append(card)}}try{await load()}catch(e){m.textContent=e.message}})();
</script><script defer src="/protection.secure.js"></script></body></html>
