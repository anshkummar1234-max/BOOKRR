<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Venue directory management · BOOKRR</title><link rel="stylesheet" href="/theme.css"><style>.page{max-width:1100px;margin:50px auto;padding:0 22px}.page h1{font:800 clamp(42px,7vw,76px)/.9 var(--display)}.item{background:#191e17;border:1px solid #ffffff20;padding:18px;margin:12px 0;display:grid;grid-template-columns:1fr auto;gap:16px}.meta{font-size:13px;color:#aab49e;line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:10px;background:var(--lime);border:0;font-weight:800;cursor:pointer}.actions .secondary{background:transparent;color:#f3f4eb;border:1px solid #ffffff40}.message{color:var(--lime);font-size:13px}@media(max-width:650px){.item{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a class="brand" href="/"><img class="brand-logo" src="/icon.svg" alt="" width="38" height="38">BOOKRR</a><div class="nav-links" style="display:flex"><a href="/admin.html">Admin dashboard</a></div></nav><main class="page"><div class="eyebrow">RESTRICTED · PROJECT ADMIN ONLY</div><h1>VENUE <span class="lime-word">DIRECTORY.</span></h1><p class="meta">Review verification status and control whether a venue appears in public search. Existing public-directory data is not automatically verified just because it is listed.</p><p id="message" class="message" role="status" aria-live="polite">Loading venues…</p><div id="list"></div></main><script>
(async()=>{const m=document.getElementById('message'),list=document.getElementById('list');async function load(){const r=await fetch('/api/admin/venues',{headers:{Accept:'application/json'}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(r.status===401?'Sign in as the project owner/admin.':r.status===403?'Access denied. Admin only.':(d.error||'Could not load venues.'));list.replaceChildren();m.textContent=(d.venues||[]).length+' venue listing(s)';for(const v of d.venues||[]){const card=document.createElement('article');card.className='item';const info=document.createElement('div'),title=document.createElement('h3'),meta=document.createElement('p');title.textContent=v.name;meta.className='meta';meta.textContent=v.area+' · '+(v.sports||[]).join(', ')+' · '+(v.hourly_rate==null?'price not set':'₹'+v.hourly_rate+'/hour')+' · '+v.opening_time.slice(0,5)+'–'+v.closing_time.slice(0,5)+' · '+v.verification_status+' · '+(v.is_active?'PUBLIC':'HIDDEN');info.append(title,meta);const actions=document.createElement('div');actions.className='actions';for(const [active,verification,label] of [[!v.is_active,v.verification_status,v.is_active?'Hide listing':'Publish listing'],[v.is_active,v.verification_status==='verified'?'unverified':'verified',v.verification_status==='verified'?'Mark unverified':'Mark verified']]){const b=document.createElement('button');b.textContent=label;if(label.includes('unverified')||label==='Hide listing')b.className='secondary';b.onclick=async()=>{b.disabled=true;try{const u=await fetch('/api/admin/venues',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:v.id,is_active:active,verification_status:verification})}),out=await u.json().catch(()=>({}));if(!u.ok)throw Error(out.error||'Update failed');await load()}catch(e){m.textContent=e.message}finally{b.disabled=false}};actions.append(b)}card.append(info,actions);list.append(card)}}try{await load()}catch(e){m.textContent=e.message}})();
</script><script defer src="/protection.secure.js"></script></body></html>
