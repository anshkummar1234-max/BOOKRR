<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My bookings · BOOKRR</title><link rel="stylesheet" href="/theme.css"><style>.page{max-width:1000px;margin:70px auto;padding:0 24px}.page h1{font:800 clamp(56px,8vw,90px)/.85 var(--display)}.booking-row{display:grid;grid-template-columns:1fr auto;gap:16px;padding:22px;margin:15px 0;background:#191e17;border:1px solid #ffffff18}.booking-row h3{margin:0 0 8px}.muted{font-size:12px;line-height:1.8;color:#aab49e}.status{font-size:10px;color:#d5ff3f;border:1px solid #d5ff3f55;padding:7px 10px;height:max-content;text-transform:uppercase;letter-spacing:.1em}.notice{color:#d5ff3f;font-size:13px;line-height:1.8}.rebook-link{display:inline-flex;align-items:center;justify-content:center;margin-top:14px;padding:11px 14px;min-height:42px;background:#d5ff3f;color:#10140f;font-size:10px;font-weight:800;letter-spacing:.03em;border:1px solid #d5ff3f}.rebook-link:hover{background:#e4ff8a}@media(max-width:600px){.page{margin:45px auto}.booking-row{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a class="brand" href="/"><img class="brand-logo" src="/icon.svg" alt="" width="38" height="38">BOOKRR</a><a class="nav-cta" href="/#book">Find a turf ↗</a></nav><main class="page"><div class="eyebrow">YOUR GAME PLAN / PRIVATE</div><h1>MY <span class="lime-word">REQUESTS.</span></h1><p class="muted">Only your own booking requests appear here. A request is not a confirmed reservation until the venue confirms it.</p><p class="notice" id="message" role="status" aria-live="polite">Loading your requests…</p><div id="list"></div></main><script>(async()=>{const m=document.getElementById('message'),list=document.getElementById('list');try{const r=await fetch('/api/my-bookings',{headers:{Accept:'application/json'}});if(r.status===401){location.replace('/login?next=%2Fmy-bookings');return}const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load requests');m.textContent=d.bookings.length?`${d.bookings.length} recent request(s)`:'No booking requests yet. Find a turf and send your first request.';list.innerHTML='';for(const b of d.bookings){const article=document.createElement('article');article.className='booking-row';const info=document.createElement('div');const h=document.createElement('h3');h.textContent=b.venue_name;const p=document.createElement('p');p.className='muted';p.textContent=`${b.venue_area} · ${b.sport} · ${b.booking_date} at ${String(b.start_time).slice(0,5)} · ${b.duration_hours} hour(s) · Request #${b.id}`;info.append(h,p);if(['confirmed','completed'].includes(b.status)){const rebook=document.createElement('a');rebook.className='rebook-link';rebook.textContent='RUN IT BACK ↗';rebook.href='/?rebook='+encodeURIComponent(b.id)+'#book';info.append(rebook)}const status=document.createElement('span');status.className='status';status.textContent=b.status;article.append(info,status);list.append(article)}}catch(e){m.textContent=e.message||'Unable to load requests. Please sign in again.'}})();</script></body></html>
