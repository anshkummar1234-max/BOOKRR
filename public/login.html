<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in · BOOKRR</title><link rel="stylesheet" href="/theme.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 20%,#354525 0, #10140f 60%)}main{width:100%;max-width:390px;padding:34px;background:#191e17;border:1px solid #d5ff3f40;box-shadow:0 30px 100px #0006}h1{font:800 54px/.9 var(--display);margin:20px 0 12px}p{color:#aab49e;font-size:13px;line-height:1.7}label{display:block;font-size:10px;letter-spacing:.12em;margin:22px 0 8px}input,button{width:100%;height:48px;padding:0 14px;border-radius:3px;font:inherit}input{background:#10140f;color:white;border:1px solid #ffffff2b}button{margin-top:12px;background:var(--lime);color:#10140f;border:0;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.ghost{background:transparent;color:#d5ff3f;border:1px solid #d5ff3f50}small{color:#87917d;font-size:11px;display:block;margin-top:16px}.msg{min-height:18px;color:#d5ff3f}a{color:#d5ff3f}</style></head><body><main><a class="brand" href="/">▣ BOOKRR</a><h1>GET IN.<br><span class="lime-word">GAME ON.</span></h1><p>Sign in or create an account with a one-time email code. No password needed.</p><form id="form"><label for="email">EMAIL ADDRESS</label><input id="email" type="email" autocomplete="username webauthn" required placeholder="you@example.com"><div id="codewrap" hidden><label for="code">ONE-TIME CODE</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code"></div><button id="submit">Send sign-in code ↗</button><button id="back" class="ghost" type="button" hidden>Change email</button></form><div class="msg" id="msg" role="status" aria-live="polite"></div><small>By continuing, you agree to use BOOKRR respectfully. <a href="/">Back to home</a></small></main><script>(()=>{const A=window.hatchable.auth;/* window.hatchable.auth.startLogin / verifyCode / getSession */,f=document.getElementById('form'),e=document.getElementById('email'),c=document.getElementById('code'),w=document.getElementById('codewrap'),b=document.getElementById('submit'),back=document.getElementById('back'),m=document.getElementById('msg');let step=0;const say=t=>m.textContent=t;const next=()=>{const n=new URLSearchParams(location.search).get('next')||'/';location.replace(n.startsWith('/')&&!n.startsWith('//')?n:'/')};if(!A){say('Sign-in is temporarily unavailable. Refresh and try again.');b.disabled=true;return}A.getSession().then(s=>{if(s&&s.user)next()}).catch(()=>{});back.onclick=()=>{step=0;w.hidden=true;back.hidden=true;b.textContent='Send sign-in code ↗';say('');e.focus()};f.onsubmit=async ev=>{ev.preventDefault();b.disabled=true;try{if(!step){await A.startLogin({email:e.value.trim()});step=1;w.hidden=false;back.hidden=false;b.textContent='Verify and continue ↗';say('Code sent. Check your email.');c.focus()}else{await A.verifyCode({email:e.value.trim(),code:c.value.trim()});next()}}catch(err){say(err&&err.status===429?'Too many attempts. Please wait and try again.':(err.message||'Could not complete sign-in. Try again.'))}finally{b.disabled=false}}})();</script></body></html>
