<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in · BOOKRR</title><link rel="stylesheet" href="/theme.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 20%,#354525 0, #10140f 60%)}main{width:100%;max-width:390px;padding:34px;background:#191e17;border:1px solid #d5ff3f40;box-shadow:0 30px 100px #0006}h1{font:800 54px/.9 var(--display);margin:20px 0 12px}p{color:#aab49e;font-size:13px;line-height:1.7}label{display:block;font-size:10px;letter-spacing:.12em;margin:22px 0 8px}input,button{width:100%;height:48px;padding:0 14px;border-radius:3px;font:inherit}input{background:#10140f;color:white;border:1px solid #ffffff2b}button{margin-top:12px;background:var(--lime);color:#10140f;border:0;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.ghost{background:transparent;color:#d5ff3f;border:1px solid #d5ff3f50}small{color:#87917d;font-size:11px;display:block;margin-top:16px}.msg{min-height:18px;color:#d5ff3f}a{color:#d5ff3f}</style></head><body><main><a class="brand" href="/"><img class="brand-logo" src="/icon.svg" alt="" width="38" height="38">BOOKRR</a><h1>GET IN.<br><span class="lime-word">GAME ON.</span></h1><p>Sign in or create an account with a one-time email code. No password needed.</p><form id="form"><label for="email">EMAIL ADDRESS</label><input id="email" type="email" autocomplete="username webauthn" required placeholder="you@example.com"><div id="codewrap" hidden><label for="code">ONE-TIME CODE</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code"></div><button id="submit">Send sign-in code ↗</button><button id="back" class="ghost" type="button" hidden>Change email</button></form><div class="msg" id="msg" role="status" aria-live="polite"></div><small>By continuing, you agree to use BOOKRR respectfully. <a href="/">Back to home</a></small></main><script defer src="/login.inline.secure.js"></script></body></html>
