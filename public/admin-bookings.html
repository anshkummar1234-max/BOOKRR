<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Booking operations · BOOKRR</title><link rel="stylesheet" href="/theme.css"><style>.page{max-width:1100px;margin:60px auto;padding:0 24px}.page h1{font:800 clamp(54px,8vw,85px)/.85 var(--display)}.rowitem{padding:20px;margin:12px 0;background:#191e17;border:1px solid #ffffff1c;display:grid;grid-template-columns:1fr auto;gap:18px}.meta{font-size:12px;color:#aab49e;line-height:1.9}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.actions button{padding:10px;background:var(--lime);border:0;font-weight:700;cursor:pointer}.actions button.reject{background:transparent;color:#f3f4eb;border:1px solid #ffffff40}.message{font-size:12px;color:var(--lime)}@media(max-width:650px){.rowitem{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a class="brand" href="/"><img class="brand-logo" src="/icon.svg" alt="" width="38" height="38">BOOKRR</a><span class="nav-links" style="display:flex">OWNER OPERATIONS</span></nav><main class="page"><div class="eyebrow">RESTRICTED / AUTHORIZED STAFF ONLY</div><h1>BOOKING <span class="lime-word">CONTROL.</span></h1><p class="meta">This dashboard requests booking data from an admin-gated endpoint. Only the project owner/admin collaborators can read or change request status.</p><p id="message" class="message" role="status" aria-live="polite">Loading…</p><div id="list"></div></main><script>(async()=>{const m=document.getElementById('message'),list=document.getElementById('list');async function load(){const r=await fetch('/api/admin/bookings',{headers:{Accept:'application/json'}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(r.status===401?'Sign in as an authorized project operator to continue.':r.status===403?'Access denied. This page is restricted to project admins.':(d.error||'Could not load bookings.'));list.innerHTML='';m.textContent=`${d.bookings.length} recent request(s)`;for(const b of d.bookings){const card=document.createElement('article');card.className='rowitem';const info=document.createElement('div'),title=document.createElement('h3'),meta=document.createElement('p');title.textContent=`#${b.id} · ${b.venue_name} · ${b.customer_name}`;meta.className='meta';meta.textContent=`${b.venue_area} · ${b.contact_phone} · ${b.sport} · ${b.booking_date} at ${String(b.start_time).slice(0,5)} · ${b.duration_hours} hour(s) · Status: ${b.status}${b.notes?' · Notes: '+b.notes:''}`;info.append(title,meta);const actions=document.createElement('div');actions.className='actions';for(const [status,label] of [['confirmed','Confirm'],['rejected','Reject'],['completed','Complete'],['cancelled','Cancel']]){const button=document.createElement('button');button.textContent=label;if(status!=='confirmed')button.classList.add('reject');button.onclick=async()=>{button.disabled=true;try{const u=await fetch('/api/admin/bookings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:b.id,status})});const out=await u.json().catch(()=>({}));if(!u.ok)throw Error(out.error||'Update failed');await load()}catch(e){m.textContent=e.message}finally{button.disabled=false}};actions.append(button)}card.append(info,actions);list.append(card)}}try{await load()}catch(e){m.textContent=e.message}})();</script></body></html>
